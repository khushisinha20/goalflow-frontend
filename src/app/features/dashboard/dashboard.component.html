<mat-toolbar color="primary">
  <span class="logo">🎯 GoalFlow</span>
  <span class="spacer"></span>
  
  <!-- Streak Display in Toolbar -->
  <div class="toolbar-streak" *ngIf="streak && streak.currentStreak > 0">
    <span class="streak-icon">🔥</span>
    <span class="streak-number">{{ streak.currentStreak }}</span>
    <span class="streak-label">day streak</span>
  </div>
  
  <span class="user-name" *ngIf="currentUser">{{ currentUser.fullName }}</span>
  <button mat-icon-button (click)="logout()" matTooltip="Logout">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<div class="dashboard-container">
  <!-- Streak Card -->
  <mat-card class="streak-card" *ngIf="streak">
    <mat-card-content>
      <div class="streak-display">
        <div class="streak-main">
          <div class="streak-icon-large">🔥</div>
          <div class="streak-info">
            <h2>{{ streak.currentStreak }} Day Streak</h2>
            <p class="best-streak">Personal Best: {{ streak.bestStreak }} days</p>
          </div>
        </div>
        <div class="streak-message">
          <p *ngIf="streak.currentStreak === 0">Start your streak by completing all targets today!</p>
          <p *ngIf="streak.currentStreak > 0 && streak.currentStreak < 7">Keep it going! 💪</p>
          <p *ngIf="streak.currentStreak >= 7 && streak.currentStreak < 30">You're on fire! 🔥</p>
          <p *ngIf="streak.currentStreak >= 30">Amazing consistency! 🏆</p>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Calendar Component -->
  <app-calendar-view></app-calendar-view>
</div>
